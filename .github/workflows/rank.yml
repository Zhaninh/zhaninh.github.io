name: Cập nhật thứ hạng dự án
on:
  schedule:
    - cron: '17 19 * * 0'   # 02:17 sáng thứ Hai, giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python metrics.py
      - run: python build.py
      - run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Weekly impact metrics and project ranking" && git push)
